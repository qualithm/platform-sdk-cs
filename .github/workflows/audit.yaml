# Generated by dx/scripts/audit-sync from ci-templates/audit-dotnet.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: NuGet Advisory Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Directory.Build.props turns NuGet's restore-time audit off so a new
      # advisory never fails CI Required on an unrelated PR; this scan turns it
      # back on for every project, the Windows shell included, and fails on any
      # advisory against a direct or transitive package.
      - name: NuGet audit
        id: scan
        continue-on-error: true
        run: |
          dotnet restore ./*.slnx --locked-mode -p:EnableWindowsTargeting=true \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low \
            -p:WarningsAsErrors="NU1901%3BNU1902%3BNU1903%3BNU1904"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: NuGet audit found a vulnerable package"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: NuGet audit found a vulnerable package"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

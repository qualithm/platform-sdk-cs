# Generated by dx/scripts/ci-sync from ci-templates/dotnet-lib.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # The pinned toolchain. dx config check holds every template that names it
  # to the same version, and the Format & Build job fails when the repo's
  # global.json disagrees. Bump it here, sync, and update the repo in the same
  # PR.
  DOTNET_SDK_VERSION: "10.0.403"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse == 'true' }}
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!LICENSE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

      # Format & Build and Test & Coverage are dotnet-winui-app.yaml's jobs,
      # copied verbatim between the dx:dotnet-* markers; a dx unit test holds the
      # copies equal, so change both templates together.
      # A promotion PR usually holds a tree an earlier run already tested:
      # a merge_group or push run tests exactly the commit it names. When one
      # passed on this tree, the build, lint, format, typecheck and unit-test
      # jobs skip. Any failed lookup means no reuse.
      - id: reuse
        if: github.event_name == 'pull_request' && github.base_ref != 'development'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || exit 0
          shas=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.event == "merge_group" or .event == "push") | .head_sha' || true)
          for sha in $shas; do
            if [[ "$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha || true)" == "$tree" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "reusing the passing run on $sha, which tested tree $tree"
              exit 0
            fi
          done
          echo "reuse=false" >> "$GITHUB_OUTPUT"
  lint:
    name: Format & Build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # dx:dotnet-format-build-begin
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Check the .NET SDK pin
        run: |
          sdk=$(jq -r '.sdk.version' global.json)
          if [[ "$sdk" != "$DOTNET_SDK_VERSION" ]]; then
            echo "::error file=global.json::pins the .NET SDK $sdk; the dx template pins $DOTNET_SDK_VERSION"
            exit 1
          fi
      # CI builds portable.slnf where the repo has one (every project except a
      # WinUI shell, which builds only on Windows), else the repo's one .slnx.
      - run: dotnet restore "$(ls portable.slnf 2>/dev/null || ls ./*.slnx)" --locked-mode
      - run: |
          dotnet format "$(ls portable.slnf 2>/dev/null || ls ./*.slnx)" --verify-no-changes --no-restore
      - run: dotnet build "$(ls portable.slnf 2>/dev/null || ls ./*.slnx)" --no-restore -c Release
      # dx:dotnet-format-build-end

  coverage:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # dx:dotnet-test-coverage-begin
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore "$(ls portable.slnf 2>/dev/null || ls ./*.slnx)" --locked-mode
      - run: |
          rm -rf coverage lcov.info
          dotnet test --solution "$(ls portable.slnf 2>/dev/null || ls ./*.slnx)" --no-restore --coverlet --coverlet-output-format lcov --results-directory coverage
          cat coverage/*.info > lcov.info
      - name: Enforce coverage threshold (>=80%)
        run: |
          awk '/^LF:/ {lf+=substr($0,4)} /^LH:/ {lh+=substr($0,4)} END {
            if (lf == 0) { print "No LF records in lcov.info"; exit 1 }
            pct = (lh / lf) * 100
            printf "Line coverage: %.2f%% (%d/%d)\n", pct, lh, lf
            if (pct + 0 < 80) { print "Coverage below 80% threshold"; exit 1 }
          }' lcov.info
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14
      # dx:dotnet-test-coverage-end

  pack:
    name: Pack
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore --locked-mode
      # Packs every packable project (tests and examples set IsPackable false)
      # with the metadata in Directory.Build.props, and its symbols as a
      # .snupkg. The release workflow packs the same way.
      - name: Pack the library and its symbols
        run: |
          rm -rf nupkg
          dotnet pack --no-restore -c Release -p:PackageOutputPath="$PWD/nupkg"
          ls nupkg/*.nupkg >/dev/null 2>&1 || { echo "::error::no .nupkg was produced"; exit 1; }
          ls nupkg/*.snupkg >/dev/null 2>&1 || { echo "::error::no .snupkg was produced"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: nupkg/
          retention-days: 14

  docs:
    name: Docs
    needs: changes
    # API docs build on the main hop only.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # docfx is a local tool, pinned in the repo's .config/dotnet-tools.json.
      - run: dotnet tool restore
      - run: dotnet restore --locked-mode
      - name: Build the API docs (fails on a warning)
        run: |
          rm -rf docs/api docs/_site
          dotnet docfx docs/docfx.json --warningsAsErrors
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: docs/_site/
          retention-days: 14

  # dx:generated-drift-begin
  generated-drift:
    name: Generated Drift
    # A generated client commits its generator's output. Rerunning the pinned
    # generator on the committed spec must reproduce it exactly, so a hand edit
    # can't pass as a generator change.
    # Ungated by `changes`: the generator pin and config live outside the code
    # filter. A repo without openapi-generator.yaml generates nothing and skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Regenerate and fail on any difference
        run: |
          if [ ! -f openapi-generator.yaml ]; then
            echo "no openapi-generator.yaml: not a generated client; skipping"
            exit 0
          fi
          scripts/generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code differs from what scripts/generate writes. Run scripts/generate and commit the result; never edit generated files by hand."
            git status --short
            git diff --stat
            exit 1
          fi
  # dx:generated-drift-end
  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry.
    # Runs on every PR, docs included: a README can carry an image reference
    # too. A repo with no vendored registry references no container image and
    # skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, lint, coverage, pack, docs, generated-drift, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
